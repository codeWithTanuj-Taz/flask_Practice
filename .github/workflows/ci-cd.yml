name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://localhost:27017/test_student_db
      SECRET_KEY: ci-test-secret

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  quality:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Black formatting
        run: black --check .

  build:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::789193817635:role/GitHubActionsECRPush
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t flask-student-app:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag flask-student-app:${{ github.sha }} \
            789193817635.dkr.ecr.us-east-1.amazonaws.com/flask-student-app:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REPO="789193817635.dkr.ecr.us-east-1.amazonaws.com/flask-student-app"

          if aws ecr describe-images \
            --repository-name flask-student-app \
            --region us-east-1 \
            --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "Image $IMAGE_TAG already exists in ECR. Skipping push."
          else
            docker push "$ECR_REPO:$IMAGE_TAG"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MONGO_URI,SECRET_KEY,IMAGE_TAG
          script: |
            set -e

            echo "Logging in to Amazon ECR..."

            aws ecr get-login-password --region us-east-1 | \
              sudo docker login \
              --username AWS \
              --password-stdin 789193817635.dkr.ecr.us-east-1.amazonaws.com

            echo "Pulling image..."

            sudo docker pull \
              789193817635.dkr.ecr.us-east-1.amazonaws.com/flask-student-app:${IMAGE_TAG}

            echo "Stopping existing container..."

            sudo docker rm -f flask-student-app || true

            echo "Starting new container..."

            sudo docker run -d \
              --name flask-student-app \
              --restart unless-stopped \
              -p 5000:5000 \
              -e MONGO_URI="$MONGO_URI" \
              -e SECRET_KEY="$SECRET_KEY" \
              789193817635.dkr.ecr.us-east-1.amazonaws.com/flask-student-app:${IMAGE_TAG}

            echo "Waiting for application..."

            for i in {1..30}; do
              if curl -fsS http://localhost:5000/health; then
                echo "Health check passed!"
                exit 0
              fi

              echo "Application not ready yet. Waiting..."
              sleep 2
            done

            echo "Health check failed!"

            sudo docker logs flask-student-app

            exit 1

  notification:
    needs:
      - test
      - quality
      - build
      - deploy

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: Send success email
        if: |
          needs.test.result == 'success' &&
          needs.quality.result == 'success' &&
          needs.build.result == 'success' &&
          needs.deploy.result == 'success'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "SUCCESS - Flask CI/CD Pipeline"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            Flask Student Registration CI/CD Pipeline

            STATUS: SUCCESS

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Docker Image:
            789193817635.dkr.ecr.us-east-1.amazonaws.com/flask-student-app:${{ github.sha }}

            Deployment:
            Amazon EC2

            Pipeline Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Test: SUCCESS
            Quality: SUCCESS
            Build: SUCCESS
            Deploy: SUCCESS

            The application was successfully deployed
            and passed the health check.


      - name: Send failure email
        if: |
          needs.test.result != 'success' ||
          needs.quality.result != 'success' ||
          needs.build.result != 'success' ||
          needs.deploy.result != 'success'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "FAILURE - Flask CI/CD Pipeline"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            Flask Student Registration CI/CD Pipeline

            STATUS: FAILURE

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Pipeline Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Job Results:

            Test:   ${{ needs.test.result }}
            Quality: ${{ needs.quality.result }}
            Build:  ${{ needs.build.result }}
            Deploy: ${{ needs.deploy.result }}

            Please open the GitHub Actions run above
            to investigate the failed stage.
